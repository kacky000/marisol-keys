<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Marisol Keys</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<div id="stage"></div>
<div id="loading"><div class="load-logo">MARISOL KEYS</div><div class="load-bar"><i></i></div><div class="load-text">raising the tide…</div></div>
<div id="error-box" class="hidden"></div>
<script>
  // Shows any start-up error on screen instead of leaving a blank page.
  function showGameError(msg) {
    var box = document.getElementById('error-box');
    box.classList.remove('hidden');
    box.textContent += msg + '\n';
  }
  addEventListener('error', function (e) { showGameError((e.message || 'error') + ' @ ' + (e.filename || '') + ':' + (e.lineno || '')); });
  addEventListener('unhandledrejection', function (e) { showGameError('promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
